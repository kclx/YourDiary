[package]
name = "YourDiary"
version = "1.0.0"
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_10"] }
reqwest = { version = "0.13.5", features = ["blocking", "multipart"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
